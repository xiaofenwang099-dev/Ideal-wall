<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f8f3" />
  <title>把理想，放在这里 · 理想墙</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
    :root{--ink:#263b35;--muted:#77837a;--paper:#f6f8f3;--green:#39735c;--line:#e6ebe3;--serif:'Noto Serif SC',serif;--sans:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1240px;margin:auto;padding:0 54px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(44,65,55,.1)}.brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:700;letter-spacing:.05em}.brandmark{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#e5eee4;color:#47735d;font-size:17px}.top-note{font-size:12px;color:var(--muted)}
    .hero{padding:58px 0 28px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#829381;margin:0 0 15px}.hero h1{font:500 clamp(34px,4.5vw,54px)/1.28 var(--serif);letter-spacing:.02em;margin:0}.hero h1 em{font-style:normal;color:#65856b}.hero p{font-size:14px;color:#738078;line-height:1.9;margin:12px 0 0}.write-btn{border:0;border-radius:999px;background:#47745e;color:white;padding:14px 23px;box-shadow:0 5px 14px #47745e26;font-size:13px;transition:.2s}.write-btn:hover{background:#345d49;transform:translateY(-2px)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;padding:25px 0 15px;border-top:1px solid var(--line);gap:15px}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid transparent;background:transparent;color:#79847d;padding:8px 13px;border-radius:999px;font-size:12px}.chip:hover{background:#edf1eb}.chip.active{background:#e4eee4;color:#42674f;border-color:#d9e6d9}.right-tools{display:flex;align-items:center;gap:12px}.sort-select{border:0;background:transparent;color:#718078;font-size:12px;padding:8px}.view-switch{border:1px solid #e1e8df;border-radius:999px;padding:3px;display:flex;background:#fff}.view-switch button{border:0;background:transparent;color:#859087;border-radius:999px;padding:7px 12px;font-size:12px}.view-switch button.active{background:#e8efe7;color:#466c52}.count{font-size:12px;color:#919b93;white-space:nowrap}
    .sky{height:490px;border-radius:22px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 49% 104%,#e4eee2 0,transparent 39%),linear-gradient(180deg,#eef3ee,#f8f8f2 78%);border:1px solid #edf0e9}.sky:before,.sky:after{content:'';position:absolute;border:1px solid #ffffff88;border-radius:50%;pointer-events:none}.sky:before{width:330px;height:330px;left:-125px;top:210px}.sky:after{width:260px;height:260px;right:-110px;top:18px}.sky-label{position:absolute;left:24px;top:20px;z-index:2;color:#9aa79c;font-size:10px;letter-spacing:.15em}.balloon{--color:#d8e7d7;position:absolute;left:var(--x);top:var(--y);width:var(--size);height:calc(var(--size)*1.15);border-radius:49% 51% 47% 49% / 44% 45% 55% 56%;border:1px solid #ffffffb8;background:radial-gradient(ellipse at 32% 23%,#ffffffaa,transparent 29%),linear-gradient(140deg,color-mix(in srgb,var(--color),white 18%),var(--color) 68%,color-mix(in srgb,var(--color),#5f7565 9%));box-shadow:inset -8px -11px 18px #425a3c12,0 11px 22px #72856b1a;display:flex;align-items:center;justify-content:center;text-align:center;padding:13px;color:#354a3c;line-height:1.6;font:500 clamp(11px,1vw,15px)/1.6 var(--serif);cursor:pointer;animation:float var(--duration) ease-in-out infinite;animation-delay:var(--delay);transition:transform .25s,filter .25s;z-index:1}.balloon:after{content:'';position:absolute;left:50%;bottom:-8px;width:11px;height:11px;background:var(--color);transform:translateX(-50%) rotate(45deg);border-right:1px solid #fff9;border-bottom:1px solid #fff9}.balloon:before{content:'';position:absolute;left:50%;bottom:-52px;height:45px;border-left:1px solid #9eae9e77;transform:rotate(3deg);transform-origin:top}.balloon:hover,.balloon:focus-visible{transform:scale(1.07);filter:saturate(1.1);z-index:4;outline:2px solid #547d60}.balloon span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.balloon.popular{z-index:2}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#87948a;gap:8px}.empty strong{font:500 20px var(--serif)}
    @keyframes float{0%,100%{translate:0 0}50%{translate:0 -11px}}.list-view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.wish-card{background:#fff;border:1px solid #edf0e9;border-radius:15px;padding:20px 21px;min-height:146px;display:flex;flex-direction:column;justify-content:space-between}.wish-card p{font:500 16px/1.8 var(--serif);margin:0 0 16px}.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#89958c}.card-meta{display:flex;align-items:center;gap:8px}.tag{padding:5px 9px;border-radius:99px;background:#eff4ed;color:#5c765f}.like-btn{border:1px solid #e9eee7;background:white;border-radius:99px;color:#6d7d70;padding:7px 11px;font-size:12px}.like-btn:hover,.like-btn.liked{background:#f8ebe9;color:#c4766b;border-color:#f0dbd7}.footnote{display:flex;justify-content:space-between;color:#9aa49c;font-size:11px;padding:23px 0 34px}
    dialog{border:0;border-radius:20px;padding:0;width:min(480px,calc(100vw - 32px));box-shadow:0 25px 80px #24372d40;color:var(--ink)}dialog::backdrop{background:#20372e70;backdrop-filter:blur(3px)}.dialog-inner{padding:30px}.dialog-top{display:flex;justify-content:space-between;align-items:center}.dialog-top h2{font:500 22px var(--serif);margin:0}.close-btn{border:0;background:#f1f3ef;border-radius:50%;width:32px;height:32px;color:#738078}.form-note{color:#879389;font-size:12px;line-height:1.7;margin:10px 0 20px}.field{display:block;font-size:12px;font-weight:600;margin:16px 0 8px}.input,.textarea,.select{width:100%;border:1px solid #e4eae2;border-radius:11px;padding:12px 13px;background:#fbfcfa;color:var(--ink);outline:none}.input:focus,.textarea:focus,.select:focus{border-color:#84a18b;box-shadow:0 0 0 3px #dfeade}.textarea{min-height:125px;resize:vertical;line-height:1.7}.char-count{text-align:right;font-size:11px;color:#9aa49b;margin-top:5px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.submit-row{display:flex;align-items:center;justify-content:space-between;margin-top:22px;gap:10px}.form-status{font-size:12px;color:#ba6759;min-height:18px}.submit-btn{border:0;border-radius:999px;background:#47745e;color:#fff;padding:12px 21px}.details-text{font:500 21px/1.9 var(--serif);margin:22px 0}.detail-line{font-size:13px;color:#839087;padding:8px 0;border-top:1px solid #edf0e9}.detail-actions{display:flex;justify-content:flex-end;margin-top:18px}
    [hidden]{display:none!important}@media(max-width:700px){.shell{padding:0 20px}.topbar{height:62px}.hero{padding:38px 0 25px;grid-template-columns:1fr}.hero h1{font-size:37px}.write-btn{justify-self:start;padding:12px 19px}.toolbar{align-items:flex-start;flex-direction:column;padding-top:18px}.right-tools{width:100%;justify-content:space-between}.filters{gap:4px}.chip{padding:7px 10px}.sky{height:490px;border-radius:16px}.balloon{font-size:11px}.list-view{grid-template-columns:1fr}.footnote{gap:12px;flex-direction:column}.form-row{grid-template-columns:1fr;gap:0}.dialog-inner{padding:24px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="brandmark" aria-hidden="true">✳</span><span>理想收集所</span></div><div style="display:flex;align-items:center;gap:16px"><div class="top-note">一个放放心里愿望的地方</div><button class="chip" id="admin-entry">管理员登录</button></div></header>
    <main>
      <section class="hero"><div><p class="eyebrow">A LITTLE PLACE FOR BIG DREAMS</p><h1>把理想，<em>放在这里。</em></h1><p>每一个愿望都值得被看见。写下你的那一个，也读读别人的心愿吧。</p></div><button class="write-btn" id="open-submit">＋ 写下我的理想</button></section>
      <section class="toolbar" aria-label="理想墙筛选与视图"><div class="filters" id="filters" role="group" aria-label="按分类筛选"></div><div class="right-tools"><label class="count" id="count-label"></label><select class="sort-select" id="sort" aria-label="投稿排序"><option value="new">最新发布</option><option value="popular">最受欢迎</option></select><div class="view-switch" role="group" aria-label="切换视图"><button class="active" data-view="sky" aria-pressed="true">☁ 气球</button><button data-view="list" aria-pressed="false">▤ 列表</button></div></div></section>
      <section class="sky" id="sky" aria-label="理想气球墙"><span class="sky-label">DREAMS IN THE AIR</span></section><section class="list-view" id="list" hidden aria-label="理想列表"></section>
    </main>
    <footer class="footnote"><span>愿所有认真许下的心愿，都慢慢靠近。</span><span id="storage-note">演示模式：数据仅保存在当前浏览器</span></footer>
  </div>
  <dialog id="submit-dialog"><form class="dialog-inner" id="wish-form"><div class="dialog-top"><h2>写下一个理想</h2><button type="button" class="close-btn" data-close aria-label="关闭">×</button></div><p class="form-note">不必很宏大，从心里那件小事开始就好。你的理想会和大家的愿望一起出现。</p><label class="field" for="wish-text">我的理想 <span aria-hidden="true">*</span></label><textarea class="textarea" id="wish-text" maxlength="120" required placeholder="比如：在一座靠海的小城，开一家有猫的书店……"></textarea><div class="char-count"><span id="char-count">0</span> / 120</div><div class="form-row"><div><label class="field" for="wish-category">选一个分类 <span aria-hidden="true">*</span></label><select class="select" id="wish-category" required></select></div><div><label class="field" for="wish-name">怎么称呼你（选填）</label><input class="input" id="wish-name" maxlength="24" placeholder="留空就是匿名" /></div></div><div class="submit-row"><span class="form-status" id="form-status" role="status" aria-live="polite"></span><button class="submit-btn" type="submit">放进天空　↗</button></div></form></dialog>
  <dialog id="detail-dialog"><div class="dialog-inner"><div class="dialog-top"><h2>这颗小小的理想</h2><button type="button" class="close-btn" data-close aria-label="关闭">×</button></div><div id="detail-content"></div></div></dialog>
  <dialog id="admin-dialog"><form class="dialog-inner" id="admin-form"><div class="dialog-top"><h2 id="admin-title">管理员登录</h2><button type="button" class="close-btn" data-close aria-label="关闭">×</button></div><p class="form-note" id="admin-hint">管理员登录后可以编辑或删除投稿。</p><label class="field" id="admin-email-label" for="admin-email" hidden>管理员邮箱</label><input class="input" type="email" id="admin-email" autocomplete="username" placeholder="name@example.com" hidden /><label class="field" for="admin-password">管理员密码</label><input class="input" type="password" id="admin-password" minlength="8" autocomplete="current-password" required /><label class="field" id="confirm-label" for="admin-confirm" hidden>再次输入密码</label><input class="input" type="password" id="admin-confirm" minlength="8" autocomplete="new-password" hidden /><div class="submit-row"><span class="form-status" id="admin-status" role="status" aria-live="polite"></span><button class="submit-btn" type="submit" id="admin-submit">登录</button></div></form></dialog>
  <dialog id="edit-dialog"><form class="dialog-inner" id="edit-form"><div class="dialog-top"><h2>编辑这份理想</h2><button type="button" class="close-btn" data-close aria-label="关闭">×</button></div><label class="field" for="edit-text">理想内容</label><textarea class="textarea" id="edit-text" maxlength="120" required></textarea><div class="form-row"><div><label class="field" for="edit-category">分类</label><select class="select" id="edit-category"></select></div><div><label class="field" for="edit-name">昵称</label><input class="input" id="edit-name" maxlength="24" /></div></div><div class="submit-row"><button type="button" class="like-btn" id="delete-wish">删除投稿</button><button class="submit-btn" type="submit">保存修改</button></div></form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
  (()=>{
    const categories=['全部','生活','旅行','事业','关系','成长','世界'];
    const palette=['#d4e5d6','#ead7cc','#d8dfef','#e9e3bd','#d8e8e6','#ead7e1','#d8e3ee','#e9ddc6','#dce5cf'];
    const seed=[
      ['在海边的小城开一家书店，窗台上永远有一只晒太阳的猫。','生活','小岛'],['和妈妈一起去看一次极光。我们把这个愿望说了好多年。','旅行','晚风'],
      ['成为一个能把复杂的事情，讲给更多人听的老师。','事业','一颗橘子'],['三十五岁之前，走完家门口那条山脉的所有步道。','成长','匿名'],
      ['每个月认真做一次饭，邀请很久没见的老朋友。','关系','树懒同学'],['有能力给家里人买一张说走就走的机票。','生活','阿禾'],
      ['去冰岛住一个月，什么安排都没有，只跟着天气散步。','旅行','慢慢来'],['做一个小小的公益计划，让乡村孩子也能读到好书。','世界','萤火'],
      ['学会弹完整首《月亮代表我的心》，弹给喜欢的人听。','成长','匿名'],['和最好的朋友，在不同的城市也能每年见一面。','关系','Momo'],
      ['做一份喜欢的工作，也留出时间好好过生活。','事业','清晨四点'],['等花开的时候，带爷爷奶奶去看一整片油菜花田。','生活','橙子汽水'],
      ['在雨林里听一夜的雨声，醒来时不用看手机。','旅行','南风'],['种一棵树，等它长成可以乘凉的样子。','世界','匿名'],
      ['每年写一本小小的旅行手账，记住路上的人和风景。','成长','纸飞机']
    ];
    const starter=seed.map((s,i)=>({id:'seed-'+i,text:s[0],category:s[1],name:s[2],likes:[50,19,16,14,12,11,9,8,7,6,5,4,3,2,1][i],created:Date.now()-(i+1)*3600000,color:palette[i%palette.length],demo:true}));
    const config=window.IDEAL_WALL_SUPABASE||{};
    const cloud=Boolean(config.url&&config.anonKey&&window.supabase?.createClient);
    const db=cloud?window.supabase.createClient(config.url,config.anonKey):null;
    const safeRead=(key,fallback)=>{try{const x=JSON.parse(localStorage.getItem(key));return Array.isArray(x)?x:fallback}catch{return fallback}};
    let wishes=cloud?[]:safeRead('ideal-wall-wishes-v1',starter), liked=new Set(cloud?[]:safeRead('ideal-wall-likes-v1',[])), filter='全部', sort='new', view='sky', isAdmin=false, editingId=null,setupAdmin=false,loading=false;
    const note=document.querySelector('#storage-note');
    if(cloud)note.textContent='共享模式：投稿和点赞保存在理想墙数据库中';
    const save=()=>{if(cloud)return;try{localStorage.setItem('ideal-wall-wishes-v1',JSON.stringify(wishes));localStorage.setItem('ideal-wall-likes-v1',JSON.stringify([...liked]))}catch{}};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const visible=()=>[...wishes].filter(w=>filter==='全部'||w.category===filter).sort((a,b)=>sort==='new'?b.created-a.created:b.likes-a.likes);
    const filters=document.querySelector('#filters');
    categories.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==='全部'?' active':'');b.textContent=c;b.setAttribute('aria-pressed',c==='全部');b.onclick=()=>{filter=c;filters.querySelectorAll('button').forEach(x=>{const on=x.textContent===c;x.classList.toggle('active',on);x.setAttribute('aria-pressed',on)});render()};filters.append(b)});
    const sky=document.querySelector('#sky'),list=document.querySelector('#list');
    function render(){const items=visible();document.querySelector('#count-label').textContent=`${items.length} 个愿望`;sky.querySelectorAll('.balloon,.empty').forEach(x=>x.remove());list.innerHTML='';sky.hidden=view!=='sky';list.hidden=view!=='list';
      if(!items.length){sky.insertAdjacentHTML('beforeend','<div class="empty"><strong>天空暂时很安静</strong><span>换个分类看看，或者放进一个新的愿望。</span></div>');list.innerHTML='<div class="empty"><strong>这里还没有理想</strong></div>';return}
      const coords=[[48,19],[25,12],[70,15],[12,39],[37,48],[62,43],[82,37],[20,67],[48,69],[75,66],[34,25],[57,5],[7,9],[88,10],[5,59]];
      items.forEach((w,i)=>{const size=Math.min(126,Math.round(78+Math.sqrt(w.likes)*4.1));let [x,y]=coords[i%coords.length];if(items.length<5){x=15+i*(70/(items.length||1));y=22+(i%2)*37}const btn=document.createElement('button');btn.className='balloon'+(w.likes>=15?' popular':'');btn.style.cssText=`--size:${size}px;--x:calc(${x}% - ${size/2}px);--y:calc(${y}% - ${size/2}px);--color:${w.color||palette[i%palette.length]};--duration:${5+(i%4)*.8}s;--delay:${-(i%5)*.7}s`;btn.setAttribute('aria-label',`${w.text}，${w.category}，${w.likes} 个赞`);btn.innerHTML=`<span>${esc(w.text)}</span>`;btn.onclick=()=>showDetail(w.id);sky.append(btn);
        const card=document.createElement('article');card.className='wish-card';card.innerHTML=`<p>${esc(w.text)}</p><div class="card-foot"><div class="card-meta"><span class="tag">${esc(w.category)}</span><span>${esc(w.name||'匿名')}</span></div><span style="display:flex;gap:6px">${isAdmin?`<button class="like-btn" data-edit="${esc(w.id)}">编辑</button>`:''}<button class="like-btn ${liked.has(w.id)?'liked':''}" data-like="${esc(w.id)}" aria-pressed="${liked.has(w.id)}" aria-label="${liked.has(w.id)?'已赞':'点赞'}，${w.likes} 个赞">${liked.has(w.id)?'♥':'♡'} ${w.likes}</button></span></div>`;list.append(card);
      });list.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
    }
    async function refreshCloud(){const {data,error}=await db.from('wishes').select('id,text,category,nickname,like_count,created_at').order('created_at',{ascending:false});if(error)throw error;const likesResult=await db.from('wish_likes').select('wish_id');if(likesResult.error)throw likesResult.error;wishes=(data||[]).map((w,i)=>({id:w.id,text:w.text,category:w.category,name:w.nickname||'匿名',likes:w.like_count||0,created:Date.parse(w.created_at),color:palette[i%palette.length]}));liked=new Set((likesResult.data||[]).map(x=>x.wish_id));render()}
    function showError(error,target='#form-status'){const msg=error?.message||'暂时无法连接，请稍后重试。';document.querySelector(target).textContent=msg.length>120?'操作失败，请检查网络连接后重试。':msg}
    async function toggleLike(id){if(liked.has(id))return;const w=wishes.find(x=>x.id===id);if(!w)return;if(cloud){const {error}=await db.from('wish_likes').insert({wish_id:id});if(error&&error.code!=='23505'){note.textContent='点赞失败，请检查网络后重试';await refreshCloud().catch(()=>{});return}liked.add(id);await refreshCloud();if(document.querySelector('#detail-dialog').open)showDetail(id);return}w.likes++;liked.add(id);save();render()}
    function showDetail(id){const w=wishes.find(x=>x.id===id);if(!w)return;document.querySelector('#detail-content').innerHTML=`<p class="details-text">${esc(w.text)}</p><div class="detail-line">分类　${esc(w.category)}</div><div class="detail-line">署名　${esc(w.name||'匿名')}</div><div class="detail-line">喜欢　♥ ${w.likes}</div><div class="form-status" role="status" aria-live="polite"></div><div class="detail-actions" style="gap:8px">${isAdmin?`<button class="like-btn" id="detail-edit">编辑</button>`:''}<button class="like-btn ${liked.has(id)?'liked':''}" id="detail-like" aria-pressed="${liked.has(id)}">${liked.has(id)?'♥ 已喜欢':'♡ 喜欢这份理想'}</button></div>`;document.querySelector('#detail-like').onclick=()=>toggleLike(id).catch(e=>showError(e,'#detail-content .form-status'));if(isAdmin)document.querySelector('#detail-edit').onclick=()=>{document.querySelector('#detail-dialog').close();openEdit(id)};document.querySelector('#detail-dialog').showModal()}
    function openEdit(id){if(!isAdmin)return;const w=wishes.find(x=>x.id===id);if(!w)return;editingId=id;document.querySelector('#edit-text').value=w.text;document.querySelector('#edit-category').value=w.category;document.querySelector('#edit-name').value=w.name==='匿名'?'':w.name;document.querySelector('#edit-dialog').showModal()}
    categories.slice(1).forEach(c=>document.querySelector('#edit-category').add(new Option(c,c)));
    document.querySelector('#edit-form').onsubmit=async e=>{e.preventDefault();if(!isAdmin)return;const w=wishes.find(x=>x.id===editingId);if(!w)return;const value=document.querySelector('#edit-text').value.trim();if(value.length<4)return;const updated={text:value,category:document.querySelector('#edit-category').value,nickname:document.querySelector('#edit-name').value.trim()||'匿名'};if(cloud){const {error}=await db.from('wishes').update(updated).eq('id',editingId);if(error){alert('保存失败：'+error.message);return}await refreshCloud()}else{w.text=updated.text;w.category=updated.category;w.name=updated.nickname;save();render()}document.querySelector('#edit-dialog').close()};
    document.querySelector('#delete-wish').onclick=async()=>{if(!isAdmin||!editingId)return;if(!confirm('确定删除这条理想吗？此操作无法撤销。'))return;if(cloud){const {error}=await db.from('wishes').delete().eq('id',editingId);if(error){alert('删除失败：'+error.message);return}liked.delete(editingId);await refreshCloud()}else{wishes=wishes.filter(w=>w.id!==editingId);liked.delete(editingId);save();render()}document.querySelector('#edit-dialog').close()};
    const adminEntry=document.querySelector('#admin-entry'),adminDialog=document.querySelector('#admin-dialog'),adminForm=document.querySelector('#admin-form');
    async function digest(s){const bytes=new TextEncoder().encode(s),hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
    async function checkAdmin(){if(!cloud)return false;const {data:{user}}=await db.auth.getUser();if(!user||user.is_anonymous)return false;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&Boolean(data)}
    adminEntry.onclick=async()=>{if(isAdmin){if(cloud){await db.auth.signOut();await db.auth.signInAnonymously().catch(()=>{})}isAdmin=false;adminEntry.textContent='管理员登录';render();return}setupAdmin=!cloud&&!localStorage.getItem('ideal-wall-admin-hash-v1');document.querySelector('#admin-title').textContent='管理员登录';document.querySelector('#admin-hint').textContent=cloud?'使用已授权的 Supabase 管理员邮箱登录。':'首次使用请设置至少 8 位密码。此登录仅限本地演示。';document.querySelector('#admin-email-label').hidden=!cloud;document.querySelector('#admin-email').hidden=!cloud;document.querySelector('#admin-email').required=cloud;document.querySelector('#confirm-label').hidden=!setupAdmin;document.querySelector('#admin-confirm').hidden=!setupAdmin;document.querySelector('#admin-submit').textContent=setupAdmin?'设置密码并登录':'登录';document.querySelector('#admin-status').textContent='';adminForm.reset();adminDialog.showModal()};
    adminForm.onsubmit=async e=>{e.preventDefault();const p=document.querySelector('#admin-password').value,status=document.querySelector('#admin-status');if(p.length<8){status.textContent='密码至少需要 8 位。';return}if(cloud){const email=document.querySelector('#admin-email').value.trim();const {error}=await db.auth.signInWithPassword({email,password:p});if(error){status.textContent='登录失败，请检查邮箱和密码。';return}isAdmin=await checkAdmin();if(!isAdmin){await db.auth.signOut();await db.auth.signInAnonymously().catch(()=>{});status.textContent='此账户尚未被授权为理想墙管理员。';return}}else if(setupAdmin){if(p!==document.querySelector('#admin-confirm').value){status.textContent='两次输入的密码不一致。';return}localStorage.setItem('ideal-wall-admin-hash-v1',await digest(p))}else if(await digest(p)!==localStorage.getItem('ideal-wall-admin-hash-v1')){status.textContent='密码不正确。';return}isAdmin=true;adminEntry.textContent='退出管理员';adminDialog.close();render()};
    const formDialog=document.querySelector('#submit-dialog'),form=document.querySelector('#wish-form'),text=document.querySelector('#wish-text');document.querySelector('#open-submit').onclick=()=>formDialog.showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.querySelectorAll('dialog').forEach(d=>d.onclick=e=>{if(e.target===d)d.close()});
    categories.slice(1).forEach(c=>document.querySelector('#wish-category').add(new Option(c,c)));text.oninput=()=>document.querySelector('#char-count').textContent=text.value.length;
    form.onsubmit=async e=>{e.preventDefault();const value=text.value.trim(),status=document.querySelector('#form-status');if(value.length<4){status.textContent='再多写几个字吧，让大家更懂你的理想。';text.focus();return}if(value.length>120){status.textContent='理想最多写 120 个字。';return}const category=document.querySelector('#wish-category').value,name=document.querySelector('#wish-name').value.trim()||'匿名';try{if(cloud){const {error}=await db.from('wishes').insert({text:value,category,nickname:name});if(error){showError(error);return}await refreshCloud()}else{wishes.unshift({id:'wish-'+crypto.randomUUID(),text:value,category,name,likes:0,created:Date.now(),color:palette[Math.floor(Math.random()*palette.length)]});save()}}catch(error){showError(error);return}filter='全部';filters.querySelectorAll('button').forEach(b=>{const on=b.textContent==='全部';b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});sort='new';document.querySelector('#sort').value='new';form.reset();document.querySelector('#char-count').textContent='0';status.textContent='';formDialog.close();view='sky';document.querySelectorAll('[data-view]').forEach(b=>{const on=b.dataset.view==='sky';b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});render();note.textContent=cloud?'投稿成功，理想已放进共享天空':'已保存到当前浏览器';setTimeout(()=>{if(cloud)note.textContent='共享模式：投稿和点赞保存在理想墙数据库中';else note.textContent='演示模式：数据仅保存在当前浏览器'},3500);window.scrollTo({top:0,behavior:'smooth'})};
    document.querySelector('#sort').onchange=e=>{sort=e.target.value;render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',on)});render()});
    async function startCloud(){try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){const {error:signInError}=await db.auth.signInAnonymously();if(signInError)throw signInError}isAdmin=await checkAdmin();if(isAdmin)adminEntry.textContent='退出管理员';await refreshCloud();note.textContent='共享模式：投稿和点赞保存在理想墙数据库中'}catch(error){note.textContent='共享数据库连接失败：请检查 Supabase 项目配置';document.querySelector('#count-label').textContent='连接失败';console.error(error)}}
    if(cloud){note.textContent='正在连接共享理想墙…';startCloud()}else render();
  })();
  </script>
</body>
